[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rkflash"
version = "0.1.0"
description = "Pure-Python Rockchip RockUSB flashing engine"
requires-python = ">=3.10"

[project.scripts]
rkflash = "rkflash.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rkflash", "rkflash.protocol", "rkflash.transport",
             "rkflash.firmware", "rkflash.flashing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
